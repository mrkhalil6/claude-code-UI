<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:;">
    <title>Claude Code UI</title>
    <style>
      /* Prevent flash of unstyled content */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0d1117;
        color: #e6edf3;
      }
    </style>
    <script>
      /* Apply custom theme colors before React mounts to prevent flash */
      (function() {
        try {
          var theme = localStorage.getItem('theme-mode') || 'dark';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var raw = localStorage.getItem('custom-theme-colors');
          if (raw) {
            var data = JSON.parse(raw);
            var overrides = data[theme];
            if (overrides) {
              var el = document.documentElement;
              if (overrides['bg-primary']) {
                el.style.setProperty('--bg-primary', overrides['bg-primary']);
                document.body.style.backgroundColor = overrides['bg-primary'];
              }
              if (overrides['text-primary']) {
                el.style.setProperty('--text-primary', overrides['text-primary']);
                document.body.style.color = overrides['text-primary'];
              }
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
